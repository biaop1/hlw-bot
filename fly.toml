# fly.toml app configuration file generated for hlw-bot on 2026-05-28T05:40:40Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'hlw-bot'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  strategy = 'immediate'

[processes]
  app = 'python bot.py'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
